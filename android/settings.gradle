rootProject.name = 'adude'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

// Apply community CLI native modules settings if the file exists (some build envs
// or RN versions may not provide this file in node_modules). Guard to avoid
// failing the Gradle configuration step in CI or EAS builds.
def nativeModulesGradle = file('../node_modules/@react-native-community/cli-platform-android/native_modules.gradle')
if (nativeModulesGradle.exists()) {
  apply from: nativeModulesGradle
  // applyNativeModulesSettingsGradle is defined inside the applied script
  try {
    applyNativeModulesSettingsGradle(settings)
  } catch (ignored) {
    // If the method is not present for some RN versions, ignore
    println('applyNativeModulesSettingsGradle not available; skipping')
  }
} else {
  println('Warning: native_modules.gradle not found — skipping community CLI autolinking settings')
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
